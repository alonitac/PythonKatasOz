name: Katas Map

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "katas/test/**"
      - "tools/**"
      - ".github/workflows/map.yaml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  # Which student PRs to test: the PR that triggered the run, or every open fork PR
  # (push to main, schedule, manual run) so new official tests credit existing solutions.
  targets:
    if: github.event_name != 'pull_request_target' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
          LOGIN: ${{ github.event.pull_request.head.repo.owner.login }}
          REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request_target" ]; then
            if [ "$FORK" = "true" ]; then
              matrix=$(jq -cn --arg login "$LOGIN" --arg repo "$REPO" --arg sha "$SHA" --argjson pr "$PR" \
                '[{login: $login, repo: $repo, sha: $sha, pr: $pr}]')
            else
              matrix='[]'
            fi
          else
            matrix=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 250 \
              --json number,headRefOid,headRepository,headRepositoryOwner,isCrossRepository \
              --jq '[.[] | select(.isCrossRepository) | {login: .headRepositoryOwner.login,
                     repo: (.headRepositoryOwner.login + "/" + .headRepository.name), sha: .headRefOid, pr: .number}]')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<< "$matrix")" >> "$GITHUB_OUTPUT"

  # Runs untrusted student code: read-only token, no secrets, no persisted credentials,
  # and no actions/cache or setup-python caching anywhere in this repo (caches written here are scoped to main).
  test:
    needs: targets
    if: needs.targets.outputs.count != '0'
    name: test ${{ matrix.target.login }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        target: ${{ fromJson(needs.targets.outputs.matrix) }}
    steps:
      - name: Checkout official katas and tests (main)
        uses: actions/checkout@v4
        with:
          path: trusted
          persist-credentials: false

      - name: Checkout student solutions
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ matrix.target.sha }}
          path: student
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint (informational only)
        continue-on-error: true
        run: |
          pip install -q pylint
          pylint --rcfile trusted/.pylintrc student/katas/*.py

      - name: Run official tests
        working-directory: trusted
        run: python3 -m tools.map.run_tests --trusted . --student ../student --worlds docs/worlds.json --out ../results.json

      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.target.login }}-${{ matrix.target.pr }}
          path: results.json
          retention-days: 1

  # Trusted: never checks out or executes PR code. Identities come from the targets job, not from artifacts.
  collect:
    needs: [targets, test]
    if: >-
      always() && !cancelled() && (
        needs.targets.result == 'success' ||
        (github.event_name == 'pull_request_target' && github.event.action == 'closed')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download test results
        if: needs.test.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results

      - name: Update progress.json on branch map-data
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          TARGETS: ${{ needs.targets.outputs.matrix }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PROGRESS="$RUNNER_TEMP/progress.json"
          printf '%s' "${TARGETS:-[]}" > "$RUNNER_TEMP/targets.json"
          mkdir -p results
          cli() { python3 -m tools.map.progress "$1" --worlds docs/worlds.json --katas-dir katas --progress "$PROGRESS" "${@:2}"; }

          update() {
            if [ "$ACTION" = "closed" ] || [ "$EVENT" = "schedule" ]; then
              open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 500 \
                --json headRepositoryOwner --jq '[.[].headRepositoryOwner.login] | join(",")')
              cli prune --open-logins "$open"
            fi
            cli apply-all --results-dir results --targets "$RUNNER_TEMP/targets.json"
            cli recompute
          }

          for attempt in 1 2 3 4 5; do
            parent=""
            rm -f "$PROGRESS"
            if git fetch --depth 1 origin map-data 2>/dev/null; then
              parent=$(git rev-parse FETCH_HEAD)
              git show FETCH_HEAD:progress.json > "$PROGRESS" || rm -f "$PROGRESS"
            fi
            update
            blob=$(git hash-object -w "$PROGRESS")
            tree=$(printf '100644 blob %s\tprogress.json\n' "$blob" | git mktree)
            commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "map: $EVENT ${ACTION:-}")
            if git push origin "$commit:refs/heads/map-data"; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), retrying"
            sleep $((RANDOM % 5 + 1))
          done
          exit 1

  deploy:
    needs: collect
    if: always() && needs.collect.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assemble site
        run: |
          git fetch --depth 1 origin map-data
          git show FETCH_HEAD:progress.json > docs/progress.json
          rm -rf docs/superpowers

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # The artifact listing API can lag right after upload; retry once if the artifact isn't visible yet.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
